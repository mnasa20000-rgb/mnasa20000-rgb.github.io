<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오동이네 앱</title>
<meta name="description" content="개인 개발자 오동이네가 만든 Android 앱">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Sans:wght@400;600&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #0F5257;
    --bg: #FBFBF9;
    --text: #1C1F1E;
    --muted: #4A5250;
    --line: #E3E2DC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', 'IBM Plex Sans KR', sans-serif;
    line-height: 1.6;
  }
  main { max-width: 640px; margin: 0 auto; padding: 64px 16px; }
  h1, h2 { font-family: 'Space Grotesk', 'IBM Plex Sans KR', sans-serif; font-weight: 600; }
  h1 { font-size: 32px; margin: 0 0 8px; }
  h2 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0 0 16px; max-width: 65ch; }
  .lead { color: var(--muted); }
  .app { border-top: 1px solid var(--line); padding: 24px 0; }
  a { color: var(--primary); font-weight: 600; }
  a:hover { text-decoration-thickness: 2px; }
  footer { border-top: 1px solid var(--line); padding-top: 24px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>오동이네</h1>
  <p class="lead">개인 개발자가 만드는 작고 쓸모 있는 Android 앱.</p>

  <section class="app">
    <h2>고양이 수평계 - 정확한 수평기</h2>
    <p>Cat Level - Bubble &amp; Spirit. 휴대폰을 수평계로 바꿔 줍니다. 수평이 맞으면 고양이가 편하게 눕습니다.</p>
    <p>
      <a href="https://play.google.com/store/apps/details?id=com.mnasa2000.spiritlevel">Google Play에서 보기</a>
      &nbsp;·&nbsp;
      <a href="https://odongene.blogspot.com/2026/09/privacy-policy-level-bubble-level.html">개인정보처리방침</a>
    </p>
  </section>

  <section class="app">
    <h2>고양이 소음측정기</h2>
    <p>Cat Noise Meter. 주변 소리가 몇 dB인지 재 줍니다. 시끄러우면 고양이가 귀를 가립니다.</p>
    <p>
      <a href="./privacy-noise.html">개인정보처리방침</a>
    </p>
  </section>

  <footer>문의는 Google Play 스토어의 개발자 연락처로 보내 주세요.</footer>
</main>
</body>
</html>
